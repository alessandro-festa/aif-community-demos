apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: dora-compliance-ollama
    ai-factory.suse.com/blueprint-version: 1.0.0
  name: dora-compliance-ollama-1-0-0
# DORA Compliance Analysis (Ollama, CPU).
# Apache Airflow simulates synthetic ICT operational incidents, classifies each against the
# EU DORA / BaFin Article 18 thresholds (CRITICAL / MAJOR / MINOR + notification deadline),
# builds compliance marts in PostgreSQL, and indexes the incidents in Qdrant for semantic
# search. A local SUSE UI reads the results; a local LLM (Ollama, granite4) EXPLAINS incidents
# and acts as a compliance AGENT that searches the data (through Airflow's Postgres
# connection) and can trigger/monitor the pipeline via the Airflow REST API. All components
# from the SUSE Application Collection.
#
# Faithful to the DORA classifier rules of Chirag-Kathuria-009/DORA-Pipeline; the reference's
# Kafka/PySpark/Iceberg/dbt/Great Expectations/Superset stack is replaced by Airflow Python
# tasks + PostgreSQL + Qdrant + a local FastAPI UI (the all-SUSE-AppCo pattern). The reference
# has no LLM — the explain + agent layer is this blueprint's addition.
spec:
  source: Custom  # community, unsupported demo blueprint (CRD enum has no "Community")
  displayName: DORA Compliance Analysis (Ollama, CPU)
  version: 1.0.0
  description: |
    EU DORA (Digital Operational Resilience Act) ICT-incident compliance pipeline. Apache
    Airflow simulates synthetic ICT operational incidents, classifies each one against the
    BaFin Article 18 thresholds (CRITICAL — 4h deadline / MAJOR — 72h / MINOR — internal
    log), enriches them with ICT third-party provider concentration risk, builds compliance
    marts (BaFin report, vendor risk, SLA breaches) in PostgreSQL, and indexes the incidents
    in Qdrant for semantic search. A local SUSE-styled UI shows severity distribution, the
    BaFin reporting queue and SLA breaches; a local LLM (Ollama, granite4) EXPLAINS individual
    incidents and acts as a compliance AGENT — an OpenAI function-calling loop whose tools
    query the data through Airflow's Postgres connection, run Qdrant semantic search, and
    trigger/monitor the pipeline via the Airflow REST API.

    Faithful to the DORA classifier rules of Chirag-Kathuria-009/DORA-Pipeline; the
    reference's Kafka/PySpark/Iceberg/dbt/Great Expectations/Superset stack is replaced by
    Airflow Python tasks + PostgreSQL + Qdrant + this local UI, all from the SUSE Application
    Collection. The reference has no LLM — the explain + agent layer is this blueprint's
    addition.

    Prerequisites: the SUSE AI Factory operator, the application-collection ClusterRepo
    (+ credentials secret), a default StorageClass, and cert-manager. After importing, create
    an AIWorkload from this Blueprint in the AI Factory UI, trigger the run_pipeline DAG in
    the Airflow UI, then run the local UI from ui/ (see the README next to this CR). Batch size is controlled by
    N_INCIDENTS (default 600).
  components:
  # ----------------------------------------------------------------------- #
  # PostgreSQL — tabular store for raw incidents, classifications and marts.
  # ----------------------------------------------------------------------- #
  - chartName: postgresql
    chartRepo: application-collection
    chartVersion: 0.7.0
    values:
      fullnameOverride: dora-db
      image:
        registry: dp.apps.rancher.io
        repository: containers/postgresql
      auth:
        database: dora
        username: dora
        password: dora
        postgresPassword: doraadmin
      primary:
        persistence:
          enabled: true
          size: 8Gi
  # ----------------------------------------------------------------------- #
  # Qdrant — incident embeddings for the compliance agent's semantic search.
  # ----------------------------------------------------------------------- #
  - chartName: qdrant
    chartRepo: suse-ai-registry
    chartVersion: 1.19.0
    values:
      fullnameOverride: qdrant
      persistence:
        accessModes: ["ReadWriteOnce"]
        size: 5Gi
      service:
        type: ClusterIP
  # ----------------------------------------------------------------------- #
  # Ollama — local LLM (compliance analyst + agent), CPU.
  # ----------------------------------------------------------------------- #
  - chartName: ollama
    chartRepo: application-collection
    chartVersion: 1.76.0
    values:
      fullnameOverride: ollama
      image:
        pullPolicy: IfNotPresent
        registry: dp.apps.rancher.io
        repository: containers/ollama
        tag: 0.32.14-11.95
      ollama:
        gpu:
          enabled: false
          draEnabled: false
        models:
          pull:
          - "granite4:350m-h"
          run:
          - "granite4:350m-h"
        port: 11434
      persistentVolume:
        enabled: true
        accessModes:
        - ReadWriteOnce
        size: 20Gi
      service:
        port: 11434
        type: ClusterIP
  # ----------------------------------------------------------------------- #
  # Apache Airflow — orchestrates simulate → classify → marts → index → alerts.
  # DAGs embedded in this CR; they use psycopg2 + requests only (both in the stock AppCo image).
  # ----------------------------------------------------------------------- #
  - chartName: apache-airflow
    chartRepo: application-collection
    chartVersion: 1.22.2
    values:
      executor: LocalExecutor
      # Pin Airflow's generated secret keys so the pod template is STABLE across Fleet
      # re-reconciles. Left unset, the chart regenerates the api-server JWT secret on
      # every render → the deployment rolls a new ReplicaSet each reconcile → pods are
      # killed before they become Ready and the workload never converges. (Demo-fixed
      # values; for real use, reference pre-created secrets via *SecretName instead.)
      fernetKey: "Nv3aCd-3agJbJG1QxzKMezX5pJZB4fRpZIrqhdS-MA4="
      jwtSecret: "72873f21d1682ddc023f0815344d1cdc0157e59c9c5480bcb430686d6ed466d3"
      webserverSecretKey: "bb3ea2e3f0a3ad96a2f440ab3ca4e3406985aaf72182662ebd339f53a7a28a7a"
      redis:
        enabled: false
      flower:
        enabled: false
      # Stock SUSE Application Collection Airflow image — no custom build needed. The DORA
      # DAGs import only psycopg2 + requests, and both are already present in this image
      # (psycopg2 ships with Airflow's Postgres provider; requests is an Airflow core dep),
      # so there is nothing to bake (unlike the fraud blueprint, which needed heavy ML libs).
      images:
        airflow:
          repository: containers/apache-airflow
          tag: 3.3.2-13.2
          pullPolicy: IfNotPresent
          registry: dp.apps.rancher.io
      # --- BEGIN embedded DAGs (tools/embed-dags.py, source: ./dags; do not edit here) ---
      dags:
        gitSync:
          enabled: false
      extraConfigMaps:
        airflow-dags:
          useHelmHooks: false
          data: |
            build_marts.py: |2
              """
              DAG: build_marts

              Build the DORA compliance marts from `incidents_classified` (the lean analogue of the
              reference pipeline's dbt marts + Great Expectations checks):

                * mart_bafin_report  — one row per reportable (CRITICAL/MAJOR) incident with its BaFin
                                       deadline and a `reported` flag (all start unreported).
                * mart_vendor_risk   — per ICT third-party provider: incident counts by severity, total
                                       financial impact and worst client-impact (ICT concentration risk).

              Then run basic data-quality assertions (row counts, null / range checks). Failures are
              logged loudly and raise — no silent pass (replaces Great Expectations).
              """
              from __future__ import annotations

              import pendulum
              from airflow.decorators import dag, task

              from common import pg_exec, pg_query


              @dag(
                  dag_id="build_marts",
                  schedule=None,
                  start_date=pendulum.datetime(2024, 1, 1, tz="UTC"),
                  catchup=False,
                  tags=["dora", "marts"],
              )
              def build_marts():
                  @task
                  def bafin_report() -> dict:
                      pg_exec("DROP TABLE IF EXISTS mart_bafin_report CASCADE")
                      pg_exec("""
                          CREATE TABLE mart_bafin_report AS
                          SELECT incident_id, institution_id, institution_type, incident_type,
                                 ict_third_party_provider, dora_severity, clients_affected_pct,
                                 financial_impact_eur, detection_ts, deadline_hours, deadline_ts,
                                 classification_reason, FALSE AS reported
                          FROM incidents_classified
                          WHERE bafin_notification_required = TRUE
                          ORDER BY deadline_ts ASC""")
                      pg_exec("ALTER TABLE mart_bafin_report ADD PRIMARY KEY (incident_id)")
                      n = pg_query("SELECT count(*) FROM mart_bafin_report")[0][0]
                      return {"reportable": n}

                  @task
                  def vendor_risk() -> dict:
                      pg_exec("DROP TABLE IF EXISTS mart_vendor_risk CASCADE")
                      pg_exec("""
                          CREATE TABLE mart_vendor_risk AS
                          SELECT ict_third_party_provider AS provider,
                                 MAX(provider_tier) AS provider_tier,
                                 count(*) AS incidents,
                                 count(*) FILTER (WHERE dora_severity='critical') AS critical,
                                 count(*) FILTER (WHERE dora_severity='major') AS major,
                                 round(sum(financial_impact_eur)::numeric, 2) AS total_impact_eur,
                                 round(max(clients_affected_pct)::numeric, 1) AS max_clients_pct
                          FROM incidents_classified
                          WHERE ict_third_party_provider IS NOT NULL
                          GROUP BY ict_third_party_provider
                          ORDER BY critical DESC, major DESC, total_impact_eur DESC""")
                      n = pg_query("SELECT count(*) FROM mart_vendor_risk")[0][0]
                      return {"vendors": n}

                  @task
                  def quality_checks(_a: dict, _b: dict) -> str:
                      failures = []
                      total = pg_query("SELECT count(*) FROM incidents_classified")[0][0]
                      if total == 0:
                          failures.append("incidents_classified is empty")
                      bad_sev = pg_query(
                          "SELECT count(*) FROM incidents_classified "
                          "WHERE dora_severity NOT IN ('critical','major','minor')")[0][0]
                      if bad_sev:
                          failures.append(f"{bad_sev} rows with invalid dora_severity")
                      bad_pct = pg_query(
                          "SELECT count(*) FROM incidents_classified "
                          "WHERE clients_affected_pct < 0 OR clients_affected_pct > 100")[0][0]
                      if bad_pct:
                          failures.append(f"{bad_pct} rows with clients_affected_pct out of [0,100]")
                      null_deadline = pg_query(
                          "SELECT count(*) FROM mart_bafin_report WHERE deadline_ts IS NULL")[0][0]
                      if null_deadline:
                          failures.append(f"{null_deadline} reportable incidents with no deadline_ts")

                      if failures:
                          raise RuntimeError("data-quality checks FAILED: " + "; ".join(failures))
                      print(f"[dq] OK — {total} classified incidents passed all checks", flush=True)
                      return "ok"

                  quality_checks(bafin_report(), vendor_risk())


              build_marts()
            check_compliance_alerts.py: |2
              """
              DAG: check_compliance_alerts

              Compute the SLA-breach mart from the BaFin report: for every reportable (CRITICAL/MAJOR)
              incident that has not been reported, work out how long until (or since) its BaFin deadline and
              label it BREACHED (deadline already passed), IMMINENT (< 25% of the window remaining) or
              ON_TRACK. This is what the reference pipeline's `check_compliance_alerts` DAG task does.
              """
              from __future__ import annotations

              import pendulum
              from airflow.decorators import dag, task

              from common import pg_exec, pg_query


              @dag(
                  dag_id="check_compliance_alerts",
                  schedule=None,
                  start_date=pendulum.datetime(2024, 1, 1, tz="UTC"),
                  catchup=False,
                  tags=["dora", "alerts"],
              )
              def check_compliance_alerts():
                  @task
                  def alerts() -> dict:
                      now = pendulum.now("UTC")
                      rows = pg_query(
                          "SELECT incident_id, institution_id, dora_severity, deadline_hours, "
                          "detection_ts, deadline_ts, reported FROM mart_bafin_report")
                      if not rows:
                          # Not an error — there may simply be no reportable incidents.
                          pg_exec("DROP TABLE IF EXISTS mart_sla_breach CASCADE")
                          pg_exec("""CREATE TABLE mart_sla_breach (
                              incident_id TEXT PRIMARY KEY, institution_id TEXT, dora_severity TEXT,
                              deadline_ts TIMESTAMPTZ, hours_remaining DOUBLE PRECISION, status TEXT)""")
                          return {"breached": 0, "imminent": 0, "on_track": 0}

                      out, counts = [], {"BREACHED": 0, "IMMINENT": 0, "ON_TRACK": 0}
                      for (iid, inst, sev, hours, detected, deadline, reported) in rows:
                          if reported or deadline is None:
                              continue
                          remaining = (deadline - now).total_seconds() / 3600.0
                          if remaining < 0:
                              status = "BREACHED"
                          elif hours and remaining < 0.25 * hours:
                              status = "IMMINENT"
                          else:
                              status = "ON_TRACK"
                          counts[status] += 1
                          out.append((iid, inst, sev, deadline, round(remaining, 2), status))

                      pg_exec("DROP TABLE IF EXISTS mart_sla_breach CASCADE")
                      pg_exec("""CREATE TABLE mart_sla_breach (
                          incident_id TEXT PRIMARY KEY, institution_id TEXT, dora_severity TEXT,
                          deadline_ts TIMESTAMPTZ, hours_remaining DOUBLE PRECISION, status TEXT)""")
                      if out:
                          from common import pg_insert_rows
                          pg_insert_rows("mart_sla_breach",
                                         ["incident_id", "institution_id", "dora_severity",
                                          "deadline_ts", "hours_remaining", "status"], out)
                      print(f"[alerts] {counts}", flush=True)
                      return {"breached": counts["BREACHED"], "imminent": counts["IMMINENT"],
                              "on_track": counts["ON_TRACK"]}

                  alerts()


              check_compliance_alerts()
            classify_and_load.py: |2
              """
              DAG: classify_and_load

              Apply the DORA / BaFin Article 18 rules engine (common.classify_incident) to every raw
              incident, enrich it with the ICT third-party provider concentration tier, compute the BaFin
              notification deadline timestamp (detection time + 4h for CRITICAL / 72h for MAJOR), and write
              the enriched rows to `incidents_classified`. This is the lean analogue of the reference
              pipeline's PySpark classifier + dbt staging.
              """
              from __future__ import annotations

              import pendulum
              from airflow.decorators import dag, task

              from common import VENDORS, classify_incident, pg_exec, pg_insert_rows, pg_query

              RAW_COLS = ["incident_id", "ts", "institution_id", "institution_type", "incident_type",
                          "affected_systems", "clients_affected_pct", "financial_impact_eur",
                          "detection_ts", "containment_ts", "ict_third_party_provider",
                          "is_cross_border", "description"]


              @dag(
                  dag_id="classify_and_load",
                  schedule=None,
                  start_date=pendulum.datetime(2024, 1, 1, tz="UTC"),
                  catchup=False,
                  tags=["dora", "classify"],
              )
              def classify_and_load():
                  @task
                  def classify() -> dict:
                      raw = pg_query(f"SELECT {', '.join(RAW_COLS)} FROM incidents")
                      if not raw:
                          raise RuntimeError("no incidents — run simulate_incidents first")

                      pg_exec("DROP TABLE IF EXISTS incidents_classified CASCADE")
                      pg_exec("""
                          CREATE TABLE incidents_classified (
                            incident_id TEXT PRIMARY KEY,
                            ts TIMESTAMPTZ,
                            institution_id TEXT,
                            institution_type TEXT,
                            incident_type TEXT,
                            affected_systems TEXT,
                            clients_affected_pct DOUBLE PRECISION,
                            financial_impact_eur DOUBLE PRECISION,
                            detection_ts TIMESTAMPTZ,
                            containment_ts TIMESTAMPTZ,
                            ict_third_party_provider TEXT,
                            provider_tier TEXT,
                            is_cross_border BOOLEAN,
                            description TEXT,
                            dora_severity TEXT,
                            bafin_notification_required BOOLEAN,
                            deadline_hours INT,
                            deadline_ts TIMESTAMPTZ,
                            classification_reason TEXT)""")

                      counts = {"critical": 0, "major": 0, "minor": 0}
                      out = []
                      for r in raw:
                          inc = dict(zip(RAW_COLS, r))
                          v = classify_incident(inc)
                          counts[v["dora_severity"]] += 1
                          hours = v["deadline_hours"]
                          deadline_ts = None
                          if hours is not None and inc["detection_ts"] is not None:
                              deadline_ts = inc["detection_ts"] + pendulum.duration(hours=hours)
                          provider_tier = VENDORS.get(inc["ict_third_party_provider"]) if inc["ict_third_party_provider"] else None
                          out.append((
                              inc["incident_id"], inc["ts"], inc["institution_id"], inc["institution_type"],
                              inc["incident_type"], inc["affected_systems"], inc["clients_affected_pct"],
                              inc["financial_impact_eur"], inc["detection_ts"], inc["containment_ts"],
                              inc["ict_third_party_provider"], provider_tier, inc["is_cross_border"],
                              inc["description"], v["dora_severity"], v["bafin_notification_required"],
                              hours, deadline_ts, v["reason"],
                          ))

                      pg_insert_rows("incidents_classified",
                                     ["incident_id", "ts", "institution_id", "institution_type",
                                      "incident_type", "affected_systems", "clients_affected_pct",
                                      "financial_impact_eur", "detection_ts", "containment_ts",
                                      "ict_third_party_provider", "provider_tier", "is_cross_border",
                                      "description", "dora_severity", "bafin_notification_required",
                                      "deadline_hours", "deadline_ts", "classification_reason"],
                                     out)
                      return {"classified": len(out), **counts}

                  classify()


              classify_and_load()
            clear_data.py: |2
              """
              DAG: clear_data

              Reset utility — drops the DORA tables and the Qdrant incidents collection so you can
              regenerate from scratch. Trigger manually.
              """
              from __future__ import annotations

              import pendulum
              from airflow.decorators import dag, task

              from common import INCIDENTS_COLLECTION, qdrant_drop_collection, pg_exec


              @dag(
                  dag_id="clear_data",
                  schedule=None,
                  start_date=pendulum.datetime(2024, 1, 1, tz="UTC"),
                  catchup=False,
                  tags=["dora", "utility"],
              )
              def clear_data():
                  @task
                  def clear() -> str:
                      pg_exec("DROP TABLE IF EXISTS incidents, incidents_classified, "
                              "mart_bafin_report, mart_vendor_risk, mart_sla_breach CASCADE")
                      qdrant_drop_collection(INCIDENTS_COLLECTION)
                      return "cleared"

                  clear()


              clear_data()
            common.py: |2
              """
              Shared helpers for the DORA Compliance Analysis DAGs.

              The DAGs simulate synthetic ICT operational incidents, classify each one against the
              EU DORA / BaFin Article 18 thresholds (CRITICAL / MAJOR / MINOR + notification deadline),
              build compliance marts in PostgreSQL, index the incidents in Qdrant for semantic search,
              and raise SLA-breach alerts. A local SUSE-styled UI then lets an LLM *explain* incidents and
              an LLM *agent* search the data (through the same Airflow Postgres connection) and drive the
              pipeline via the Airflow REST API.

              Faithful to Chirag-Kathuria-009/DORA-Pipeline's classifier rules; the heavy streaming/
              lakehouse plumbing (Kafka/Spark/Iceberg/dbt/Great Expectations/Superset) is replaced by
              Airflow Python tasks + PostgreSQL + Qdrant + a local FastAPI UI — the all-SUSE-AppCo pattern.

              Config (env, injected by the apache-airflow component):
                POSTGRES_URI   postgresql://dora:dora@dora-db:5432/dora
                QDRANT_URL     http://qdrant:6333
                N_INCIDENTS    600     (how many synthetic incidents to simulate)
                EMBED_DIM      256     (deterministic hashing-embedding size for semantic search)
                INCIDENTS_COLLECTION  incidents
              """
              from __future__ import annotations

              import hashlib
              import math
              import os
              import re

              import psycopg2
              import psycopg2.extras
              import requests

              POSTGRES_URI = os.environ.get("POSTGRES_URI", "postgresql://dora:dora@dora-db:5432/dora")
              QDRANT_URL = os.environ.get("QDRANT_URL", "http://qdrant:6333").rstrip("/")
              QDRANT_API_KEY = os.environ.get("QDRANT_API_KEY", "")
              N_INCIDENTS = int(os.environ.get("N_INCIDENTS", "600"))
              EMBED_DIM = int(os.environ.get("EMBED_DIM", "256"))
              INCIDENTS_COLLECTION = os.environ.get("INCIDENTS_COLLECTION", "incidents")
              HTTP_TIMEOUT = 120

              # In-cluster Airflow API server (same Service the UI reaches via its "airflow" port-forward),
              # used by run_pipeline to unpause each stage DAG before triggering it.
              AIRFLOW_API_URL = os.environ.get("AIRFLOW_API_URL", "http://apache-airflow-api-server:8080").rstrip("/")
              AIRFLOW_USER = os.environ.get("AIRFLOW_USER", "admin")
              AIRFLOW_PASSWORD = os.environ.get("AIRFLOW_PASSWORD", "admin")

              # ICT third-party providers the incidents may involve, with a coarse concentration tier.
              # "critical" providers carry more systemic (concentration) risk under DORA.
              VENDORS = {
                  "AWS": "critical", "Microsoft Azure": "critical", "Google Cloud": "critical",
                  "Cloudflare": "important", "Akamai": "important", "Temenos": "important",
                  "FIS": "important", "Finastra": "important", "Stripe": "standard",
                  "Twilio": "standard", "SendGrid": "standard", "Datadog": "standard",
              }

              INSTITUTION_TYPES = ["bank", "insurer", "payment_provider", "asset_manager"]
              INCIDENT_TYPES = ["system_outage", "data_breach", "third_party_failure",
                                "cyber_attack", "transaction_failure", "authentication_failure"]


              # --------------------------------------------------------------------------- #
              # DORA / BaFin Article 18 classifier (ported from DORA-Pipeline, pure functions)
              # --------------------------------------------------------------------------- #
              # Frozen thresholds — keep these in one place so the unit test and the DAG agree.
              CRITICAL_CLIENT_PCT = 25.0
              CRITICAL_FINANCIAL_EUR = 1_000_000.0
              CRITICAL_CYBER_CLIENT_PCT = 10.0
              CRITICAL_CROSS_BORDER_CLIENT_PCT = 10.0
              MAJOR_CLIENT_PCT = 10.0
              MAJOR_FINANCIAL_EUR = 100_000.0

              DEADLINE_HOURS = {"critical": 4, "major": 72, "minor": None}


              def classify_incident(inc: dict) -> dict:
                  """Classify one incident dict against the BaFin Article 18 thresholds.

                  Returns {dora_severity, bafin_notification_required, deadline_hours, reason}.
                  `inc` keys used: clients_affected_pct, financial_impact_eur, incident_type,
                  is_cross_border, ict_third_party_provider.
                  """
                  pct = float(inc.get("clients_affected_pct") or 0.0)
                  eur = float(inc.get("financial_impact_eur") or 0.0)
                  itype = inc.get("incident_type") or ""
                  cross = bool(inc.get("is_cross_border"))
                  provider = inc.get("ict_third_party_provider")
                  is_cyber = itype == "cyber_attack"

                  severity, reason = "minor", ""
                  # CRITICAL — any of:
                  if pct >= CRITICAL_CLIENT_PCT:
                      severity, reason = "critical", f"clients affected {pct:.0f}% ≥ {CRITICAL_CLIENT_PCT:.0f}%"
                  elif eur >= CRITICAL_FINANCIAL_EUR:
                      severity, reason = "critical", f"financial impact €{eur:,.0f} ≥ €{CRITICAL_FINANCIAL_EUR:,.0f}"
                  elif is_cyber and pct >= CRITICAL_CYBER_CLIENT_PCT:
                      severity, reason = "critical", f"cyber attack with {pct:.0f}% clients ≥ {CRITICAL_CYBER_CLIENT_PCT:.0f}%"
                  elif cross and pct >= CRITICAL_CROSS_BORDER_CLIENT_PCT:
                      severity, reason = "critical", f"cross-border with {pct:.0f}% clients ≥ {CRITICAL_CROSS_BORDER_CLIENT_PCT:.0f}%"
                  # MAJOR — if not critical, any of:
                  elif pct >= MAJOR_CLIENT_PCT:
                      severity, reason = "major", f"clients affected {pct:.0f}% ≥ {MAJOR_CLIENT_PCT:.0f}%"
                  elif eur >= MAJOR_FINANCIAL_EUR:
                      severity, reason = "major", f"financial impact €{eur:,.0f} ≥ €{MAJOR_FINANCIAL_EUR:,.0f}"
                  elif provider and itype == "system_outage":
                      severity, reason = "major", f"third-party ({provider}) system outage"

                  if severity == "minor":
                      reason = "no BaFin reporting threshold met — internal logging only"

                  hours = DEADLINE_HOURS[severity]
                  return {
                      "dora_severity": severity,
                      "bafin_notification_required": severity in ("critical", "major"),
                      "deadline_hours": hours,
                      "reason": f"{severity.upper()}: {reason}",
                  }


              # --------------------------------------------------------------------------- #
              # Deterministic hashing embedding (no extra model — identical on CPU and GPU)
              # --------------------------------------------------------------------------- #
              def hash_embed(text: str, dim: int = EMBED_DIM) -> list[float]:
                  """Bag-of-words hashing embedding, L2-normalised. Cheap, dependency-free and
                  identical in the DAG (indexing) and the UI (querying) so COSINE search matches."""
                  vec = [0.0] * dim
                  for tok in re.findall(r"[a-z0-9]+", (text or "").lower()):
                      h = int(hashlib.md5(tok.encode()).hexdigest(), 16)
                      vec[h % dim] += 1.0
                  norm = math.sqrt(sum(v * v for v in vec)) or 1.0
                  return [v / norm for v in vec]


              # --------------------------------------------------------------------------- #
              # PostgreSQL
              # --------------------------------------------------------------------------- #
              def pg_conn():
                  return psycopg2.connect(POSTGRES_URI)


              def pg_exec(sql: str, params=None):
                  with pg_conn() as conn, conn.cursor() as cur:
                      cur.execute(sql, params or ())


              def pg_insert_rows(table: str, columns: list[str], rows: list[tuple]):
                  if not rows:
                      return
                  cols = ", ".join(columns)
                  with pg_conn() as conn, conn.cursor() as cur:
                      psycopg2.extras.execute_values(
                          cur, f"INSERT INTO {table} ({cols}) VALUES %s", rows, page_size=1000
                      )


              def pg_query(sql: str, params=None) -> list[tuple]:
                  with pg_conn() as conn, conn.cursor() as cur:
                      cur.execute(sql, params or ())
                      return cur.fetchall()


              # --------------------------------------------------------------------------- #
              # Qdrant (REST API — requests only)
              # --------------------------------------------------------------------------- #
              def _qdrant_headers() -> dict:
                  h = {"Content-Type": "application/json"}
                  if QDRANT_API_KEY:
                      h["api-key"] = QDRANT_API_KEY
                  return h


              def _qdrant_request(method: str, path: str, body: dict | None = None) -> dict:
                  r = requests.request(
                      method, f"{QDRANT_URL}{path}", json=body, headers=_qdrant_headers(), timeout=HTTP_TIMEOUT
                  )
                  r.raise_for_status()
                  data = r.json() if r.text else {}
                  if isinstance(data, dict) and data.get("status") not in ("ok", None):
                      raise RuntimeError(f"Qdrant error on {path}: {data}")
                  return data


              def qdrant_has_collection(name: str = INCIDENTS_COLLECTION) -> bool:
                  r = requests.get(f"{QDRANT_URL}/collections/{name}", headers=_qdrant_headers(),
                                   timeout=HTTP_TIMEOUT)
                  return r.status_code == 200


              def qdrant_drop_collection(name: str = INCIDENTS_COLLECTION) -> None:
                  if qdrant_has_collection(name):
                      _qdrant_request("DELETE", f"/collections/{name}")


              def qdrant_create_collection(dim: int = EMBED_DIM, name: str = INCIDENTS_COLLECTION) -> None:
                  _qdrant_request("PUT", f"/collections/{name}",
                                  {"vectors": {"size": dim, "distance": "Cosine"}})


              def qdrant_insert(rows: list[dict], name: str = INCIDENTS_COLLECTION) -> None:
                  batch = 200
                  for i in range(0, len(rows), batch):
                      points = [{"id": r["id"], "vector": r["vector"],
                                 "payload": {k: v for k, v in r.items() if k not in ("id", "vector")}}
                                for r in rows[i:i + batch]]
                      _qdrant_request("PUT", f"/collections/{name}/points", {"points": points})


              # --------------------------------------------------------------------------- #
              # Airflow REST API (Airflow 3 task processes have no direct DB/ORM access, so
              # unpausing a DAG from within a task must go through the API, not the ORM)
              # --------------------------------------------------------------------------- #
              def airflow_unpause(dag_id: str) -> None:
                  """Clear a DAG's is_paused flag. a fresh DAG bag registers DAGs with is_paused=True, and TriggerDagRunOperator never unpauses its target — without this, a
                  stage DAG triggered by run_pipeline can sit queued forever."""
                  token = requests.post(f"{AIRFLOW_API_URL}/auth/token",
                                        json={"username": AIRFLOW_USER, "password": AIRFLOW_PASSWORD},
                                        timeout=HTTP_TIMEOUT)
                  token.raise_for_status()
                  access_token = token.json().get("access_token") or token.json().get("jwt_token", "")
                  r = requests.patch(f"{AIRFLOW_API_URL}/api/v2/dags/{dag_id}?update_mask=is_paused",
                                     json={"is_paused": False},
                                     headers={"Authorization": f"Bearer {access_token}"},
                                     timeout=HTTP_TIMEOUT)
                  r.raise_for_status()
            index_incidents.py: |2
              """
              DAG: index_incidents

              Embed every classified incident and (re)load the vectors into Qdrant so the compliance
              agent in the UI can do semantic search ("find incidents like a cyber attack on the payments
              gateway"). Embeddings use a lightweight deterministic hashing embedding (common.hash_embed) —
              no extra model to pull, and identical on the CPU (Ollama) and GPU (vLLM) variants so search
              behaves the same everywhere.
              """
              from __future__ import annotations

              import pendulum
              from airflow.decorators import dag, task

              from common import (EMBED_DIM, INCIDENTS_COLLECTION, hash_embed,
                                  qdrant_create_collection, qdrant_drop_collection, qdrant_insert,
                                  pg_query)


              @dag(
                  dag_id="index_incidents",
                  schedule=None,
                  start_date=pendulum.datetime(2024, 1, 1, tz="UTC"),
                  catchup=False,
                  tags=["dora", "index"],
              )
              def index_incidents():
                  @task
                  def index() -> dict:
                      rows = pg_query(
                          "SELECT incident_id, dora_severity, incident_type, affected_systems, "
                          "clients_affected_pct, financial_impact_eur, ict_third_party_provider, "
                          "classification_reason, description FROM incidents_classified")
                      if not rows:
                          raise RuntimeError("no incidents_classified — run classify_and_load first")

                      qdrant_drop_collection(INCIDENTS_COLLECTION)
                      qdrant_create_collection(EMBED_DIM, INCIDENTS_COLLECTION)

                      data = []
                      for i, r in enumerate(rows):
                          (iid, sev, itype, systems, pct, eur, provider, reason, desc) = r
                          text = (f"{itype} | severity {sev} | systems {systems} | "
                                  f"{pct}% clients | €{eur} | provider {provider or 'none'} | "
                                  f"{reason} | {desc}")
                          data.append({
                              "id": i,
                              "vector": hash_embed(text),
                              "incident_id": iid,
                              "dora_severity": sev or "",
                              "incident_type": itype or "",
                              "text": text[:4096],
                          })
                      qdrant_insert(data, INCIDENTS_COLLECTION)
                      return {"indexed": len(data)}

                  index()


              index_incidents()
            run_pipeline.py: |2
              """
              DAG: run_pipeline

              One-click orchestrator — runs the whole DORA pipeline in the CORRECT order by triggering each
              stage DAG and waiting for it to finish before starting the next:

                simulate_incidents -> classify_and_load -> build_marts -> index_incidents -> check_compliance_alerts

              The stage DAGs have data dependencies (classify needs simulate's tables, marts need the
              classification, etc.), so they must not run concurrently. This is what the compliance agent's
              "run the whole pipeline" triggers, so a single trigger runs everything correctly in the
              background.
              """
              from __future__ import annotations

              import pendulum
              from airflow import DAG
              from airflow.decorators import task
              from airflow.providers.standard.operators.trigger_dagrun import TriggerDagRunOperator

              from common import airflow_unpause

              STAGES = ["simulate_incidents", "classify_and_load", "build_marts",
                        "index_incidents", "check_compliance_alerts"]


              @task
              def unpause(dag_id: str) -> None:
                  airflow_unpause(dag_id)


              with DAG(
                  dag_id="run_pipeline",
                  schedule=None,
                  start_date=pendulum.datetime(2024, 1, 1, tz="UTC"),
                  catchup=False,
                  tags=["dora", "pipeline", "orchestrator"],
              ) as dag:
                  prev = None
                  for stage in STAGES:
                      unpause_step = unpause.override(task_id=f"unpause_{stage}")(stage)
                      step = TriggerDagRunOperator(
                          task_id=f"run_{stage}",
                          trigger_dag_id=stage,
                          wait_for_completion=True,   # block until the stage finishes before the next
                          poke_interval=15,
                          reset_dag_run=True,         # allow re-runs of run_pipeline
                          allowed_states=["success"],
                          failed_states=["failed"],
                      )
                      unpause_step >> step
                      if prev:
                          prev >> unpause_step
                      prev = step
            simulate_incidents.py: |2
              """
              DAG: simulate_incidents

              Generate a batch of synthetic ICT operational incidents (the DORA-Pipeline "incident
              simulator", ported to a single Airflow task instead of Kafka+PySpark) and load them into
              PostgreSQL. Each incident carries the impact metrics BaFin Article 18 classification needs:
              clients affected %, financial impact €, incident type, cross-border flag and the ICT
              third-party provider (if any).

              `N_INCIDENTS` (default 600) controls the batch size. Detection timestamps are spread over
              the last few days — some deliberately old enough that CRITICAL/MAJOR reporting deadlines have
              already lapsed, so the SLA-breach mart and the compliance agent have something to find.
              """
              from __future__ import annotations

              import random
              import uuid

              import pendulum
              from airflow.decorators import dag, task

              from common import (INCIDENT_TYPES, INSTITUTION_TYPES, N_INCIDENTS, VENDORS,
                                  pg_exec, pg_insert_rows)

              SYSTEMS = ["core-banking", "payments-gateway", "mobile-app", "online-banking",
                         "card-processing", "trading-platform", "kyc-service", "auth-service",
                         "data-warehouse", "customer-portal"]


              @dag(
                  dag_id="simulate_incidents",
                  schedule=None,
                  start_date=pendulum.datetime(2024, 1, 1, tz="UTC"),
                  catchup=False,
                  tags=["dora", "simulate"],
              )
              def simulate_incidents():
                  @task
                  def generate() -> dict:
                      rnd = random.Random(42)
                      now = pendulum.now("UTC")
                      vendors = list(VENDORS)

                      pg_exec("DROP TABLE IF EXISTS incidents, incidents_classified, "
                              "mart_bafin_report, mart_vendor_risk, mart_sla_breach CASCADE")
                      pg_exec("""
                          CREATE TABLE incidents (
                            incident_id TEXT PRIMARY KEY,
                            ts TIMESTAMPTZ,
                            institution_id TEXT,
                            institution_type TEXT,
                            incident_type TEXT,
                            affected_systems TEXT,
                            clients_affected_pct DOUBLE PRECISION,
                            financial_impact_eur DOUBLE PRECISION,
                            detection_ts TIMESTAMPTZ,
                            containment_ts TIMESTAMPTZ,
                            ict_third_party_provider TEXT,
                            is_cross_border BOOLEAN,
                            description TEXT)""")

                      rows = []
                      for _ in range(N_INCIDENTS):
                          itype = rnd.choice(INCIDENT_TYPES)
                          # Skew impact so most incidents are MINOR, with a realistic tail of MAJOR/CRITICAL.
                          pct = round(min(100.0, rnd.gammavariate(1.4, 6.0)), 1)
                          eur = round(rnd.gammavariate(1.3, 40_000.0), 2)
                          # Third-party involvement is likely for third_party_failure / system_outage.
                          provider = None
                          if itype in ("third_party_failure", "system_outage") and rnd.random() < 0.7:
                              provider = rnd.choice(vendors)
                          elif rnd.random() < 0.15:
                              provider = rnd.choice(vendors)
                          cross = rnd.random() < 0.3

                          detected = now.subtract(hours=rnd.randint(0, 120), minutes=rnd.randint(0, 59))
                          occurred = detected.subtract(minutes=rnd.randint(5, 600))
                          contained = None
                          if rnd.random() < 0.6:
                              contained = detected.add(hours=rnd.randint(1, 96))

                          systems = ", ".join(rnd.sample(SYSTEMS, rnd.randint(1, 3)))
                          desc = (f"{itype.replace('_', ' ').title()} affecting {systems}; "
                                  f"~{pct:.0f}% of clients impacted, estimated €{eur:,.0f} loss"
                                  + (f"; ICT provider {provider} involved" if provider else "")
                                  + ("; cross-border exposure" if cross else "") + ".")

                          rows.append((
                              f"inc_{uuid.uuid4().hex[:12]}", occurred, f"inst_{rnd.randint(1, 40):03d}",
                              rnd.choice(INSTITUTION_TYPES), itype, systems, pct, eur,
                              detected, contained, provider, cross, desc,
                          ))

                      pg_insert_rows("incidents",
                                     ["incident_id", "ts", "institution_id", "institution_type",
                                      "incident_type", "affected_systems", "clients_affected_pct",
                                      "financial_impact_eur", "detection_ts", "containment_ts",
                                      "ict_third_party_provider", "is_cross_border", "description"],
                                     rows)
                      return {"incidents": len(rows)}

                  generate()


              simulate_incidents()
            test_classifier.py: |2
              """
              Unit tests for the DORA / BaFin Article 18 classifier (common.classify_incident) and the
              deterministic hashing embedding. Run: `pytest dags/test_classifier.py`.

              These assert the reference DORA-Pipeline threshold boundaries so the classification stays
              faithful if the code is refactored.
              """
              from common import (CRITICAL_CLIENT_PCT, CRITICAL_FINANCIAL_EUR, MAJOR_CLIENT_PCT,
                                  MAJOR_FINANCIAL_EUR, classify_incident, hash_embed)


              def sev(**kw):
                  base = {"clients_affected_pct": 0.0, "financial_impact_eur": 0.0,
                          "incident_type": "system_outage", "is_cross_border": False,
                          "ict_third_party_provider": None}
                  base.update(kw)
                  return classify_incident(base)["dora_severity"]


              def test_critical_by_client_pct():
                  assert sev(clients_affected_pct=CRITICAL_CLIENT_PCT) == "critical"
                  assert sev(clients_affected_pct=CRITICAL_CLIENT_PCT - 0.1) in ("major", "minor")


              def test_critical_by_financial():
                  assert sev(financial_impact_eur=CRITICAL_FINANCIAL_EUR) == "critical"
                  assert sev(financial_impact_eur=CRITICAL_FINANCIAL_EUR - 1) == "major"


              def test_critical_by_cyber():
                  # cyber attack + >=10% clients -> critical even below the 25% general threshold
                  assert sev(incident_type="cyber_attack", clients_affected_pct=10.0) == "critical"
                  assert sev(incident_type="cyber_attack", clients_affected_pct=9.9) == "minor"


              def test_critical_by_cross_border():
                  assert sev(is_cross_border=True, clients_affected_pct=10.0) == "critical"


              def test_major_by_client_pct():
                  assert sev(clients_affected_pct=MAJOR_CLIENT_PCT) == "major"
                  assert sev(clients_affected_pct=MAJOR_CLIENT_PCT - 0.1) == "minor"


              def test_major_by_financial():
                  assert sev(financial_impact_eur=MAJOR_FINANCIAL_EUR) == "major"


              def test_major_by_third_party_outage():
                  assert sev(incident_type="system_outage", ict_third_party_provider="AWS") == "major"
                  # third-party set but not a system outage -> not major on that rule alone
                  assert sev(incident_type="data_breach", ict_third_party_provider="AWS") == "minor"


              def test_minor_default():
                  r = classify_incident({"clients_affected_pct": 1.0, "financial_impact_eur": 500.0,
                                         "incident_type": "authentication_failure",
                                         "is_cross_border": False, "ict_third_party_provider": None})
                  assert r["dora_severity"] == "minor"
                  assert r["bafin_notification_required"] is False
                  assert r["deadline_hours"] is None


              def test_deadlines():
                  assert classify_incident({"clients_affected_pct": 30.0})["deadline_hours"] == 4
                  assert classify_incident({"clients_affected_pct": 12.0})["deadline_hours"] == 72


              def test_hash_embed_stable_and_normalised():
                  a = hash_embed("cyber attack on payments gateway")
                  b = hash_embed("cyber attack on payments gateway")
                  assert a == b                          # deterministic
                  assert abs(sum(x * x for x in a) - 1.0) < 1e-9   # L2-normalised
                  assert len(a) == 256
      volumes:
      - name: dags
        configMap:
          name: airflow-dags
          items:
          - key: build_marts.py
            path: build_marts.py
          - key: check_compliance_alerts.py
            path: check_compliance_alerts.py
          - key: classify_and_load.py
            path: classify_and_load.py
          - key: clear_data.py
            path: clear_data.py
          - key: common.py
            path: common.py
          - key: index_incidents.py
            path: index_incidents.py
          - key: run_pipeline.py
            path: run_pipeline.py
          - key: simulate_incidents.py
            path: simulate_incidents.py
          - key: test_classifier.py
            path: test_classifier.py
      volumeMounts:
      - name: dags
        mountPath: /opt/airflow/dags
        readOnly: true
      # --- END embedded DAGs ---
      env:
      - name: POSTGRES_URI
        value: postgresql://dora:dora@dora-db:5432/dora
      - name: QDRANT_URL
        value: http://qdrant:6333
      - name: N_INCIDENTS
        value: "600"
      ingress:
        apiServer:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
          - name: dora-airflow
            tls:
              enabled: true
