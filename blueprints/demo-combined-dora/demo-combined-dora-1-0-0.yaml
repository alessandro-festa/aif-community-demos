  # ----------------------------------------------------------------------- #
  # SHARED — Apache Airflow: one instance orchestrating all three domains' DAGs
  # (git-synced from this blueprint's dags/{dora,finops,governance}/, scanned
  # recursively). Env is the UNION of what each domain's DAGs need — no name
  # collisions between the three sets.
  # ----------------------------------------------------------------------- #
  - chartName: apache-airflow
    chartRepo: application-collection
    chartVersion: 1.22.0
    values:
      executor: LocalExecutor
      # Pin generated secret keys so the pod template is STABLE across Fleet
      # re-reconciles (left unset, the chart regenerates them each render and the
      # deployment never converges). Demo-fixed values.
      fernetKey: "Nv3aCd-3agJbJG1QxzKMezX5pJZB4fRpZIrqhdS-MA4="
      jwtSecret: "72873f21d1682ddc023f0815344d1cdc0157e59c9c5480bcb430686d6ed466d3"
      webserverSecretKey: "bb3ea2e3f0a3ad96a2f440ab3ca4e3406985aaf72182662ebd339f53a7a28a7a"
      redis:
        enabled: false
      flower:
        enabled: false
      images:
        airflow:
          repository: containers/apache-airflow
          tag: 3.2.2-8.14
          pullPolicy: IfNotPresent
          registry: dp.apps.rancher.io
      dags:
        gitSync:
          enabled: true
          repo: https://github.com/alessandro-festa/aif-community-demos.git
          branch: main
          ref: main
          rev: HEAD
          depth: 1
          subPath: blueprints/demo-combined-dora/dags
          period: 30s
      env:
      # --- DORA ---
      - name: POSTGRES_URI
        value: postgresql://dora:dora@dora-db:5432/dora
      - name: QDRANT_URL
        value: http://qdrant:6333
      - name: N_INCIDENTS
        value: "600"
      # --- FinOps ---
      - name: LITELLM_BASE_URL
        value: http://litellm:4000
      - name: LITELLM_MASTER_KEY
        value: sk-guardrails-demo
      - name: PROM_REMOTE_WRITE_URL
        value: http://prometheus-server:80/api/v1/write
      - name: TRAFFIC_REQUESTS
        value: "40"
      - name: BACKFILL_DAYS
        value: "14"
      # --- Governance ---
      - name: OM_BASE_URL
        value: http://openmetadata:8585
      - name: OM_USER
        value: admin@open-metadata.org
      - name: OM_PASSWORD
        value: admin
      - name: PGHOST
        value: gov-db
      - name: PGPORT
        value: "5432"
      - name: PG_ADMIN_USER
        value: postgres
      - name: PG_ADMIN_PASSWORD
        value: GovAdmin-Demo-1
      ingress:
        apiServer:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
          - name: demo-combined-airflow
            tls:
              enabled: true
